<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">brand-assets</title>
  <desc id="d">The TRADERMADE wordmark, its colours and its type, and how to use them. The picture: a 3-sided figure draws itself and its corners arrive one by one. With reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less. Outside this block everything is in its finished state. */
    @media (prefers-reduced-motion: no-preference) {
      .draw { stroke-dasharray: 100; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .arrive { animation: arrive .5s ease-out both; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 8s steps(48) 3s infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 5s steps(60) 3.6s infinite; }
    }
    @keyframes draw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    @keyframes halo { 0% { opacity: .55; transform: scale(1) } 70%, 100% { opacity: 0; transform: scale(2.1) } }
    .halo { opacity: 0 }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b121a"/><stop offset="1" stop-color="#0a101a"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="668" y1="0" x2="1160" y2="0"><stop offset="0.00" stop-color="#249094"/><stop offset="0.50" stop-color="#34d4d8"/><stop offset="1.00" stop-color="#96e9eb"/></linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#34d4d8" stop-opacity="0"/><stop offset=".35" stop-color="#34d4d8"/><stop offset="1" stop-color="#96e9eb"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <!-- an opaque ground: the same picture on GitHub's light and dark themes -->
    <rect width="1200" height="260" fill="url(#ground)"/>
    <path d="M916.4 152.8 L961.7 71.0 L1009.9 151.2Z" fill="#133940" fill-opacity=".35" stroke="#1d696f" stroke-width="1.5"/>
    <path d="M962.7 125.0L964.3 215.0" stroke="#133940" stroke-width="1"/>
    <path d="M962.7 125.0L883.9 81.4" stroke="#133940" stroke-width="1"/>
    <path d="M962.7 125.0L1039.8 78.6" stroke="#133940" stroke-width="1"/>
    <path class="draw" pathLength="100" d="M964.3 215.0 L883.9 81.4 L1039.8 78.6Z" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.30s"/>
    <circle class="arrive" style="animation-delay:0.35s" cx="964.3" cy="215.0" r="7" fill="#0a101a" stroke="#96e9eb" stroke-width="2.5"/>
    <circle class="arrive" style="animation-delay:1.32s" cx="883.9" cy="81.4" r="7" fill="#0a101a" stroke="#96e9eb" stroke-width="2.5"/>
    <circle class="arrive" style="animation-delay:2.28s" cx="1039.8" cy="78.6" r="7" fill="#0a101a" stroke="#96e9eb" stroke-width="2.5"/>
    <circle class="halo" cx="962.7" cy="125.0" r="12" fill="none" stroke="#96e9eb" stroke-width="2"/>
    <circle class="breathe" cx="962.7" cy="125.0" r="10" fill="#34d4d8"/>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#0c1719"/><rect x="300.0" y="248" width="300.5" height="12" fill="#249094"/><rect x="600.0" y="248" width="300.5" height="12" fill="#34d4d8"/><rect x="900.0" y="248" width="300.5" height="12" fill="#e6fafa"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="56.6" fill="#34d4d8" font-size="15" font-weight="700" letter-spacing=".6">TMADEALEX · BRAND SHELF</text><text x="56" y="122.2" fill="#e6fafa" font-size="60" font-weight="700" letter-spacing="-.5">brand-assets</text><text x="56" y="166.0" fill="#c7dadb" font-size="23">The TRADERMADE wordmark, its colours and its</text><text x="56" y="196.8" fill="#c7dadb" font-size="23">type, and how to use them.</text></g>
  </g>
</svg>
