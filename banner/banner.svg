    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="56.6" fill="#34d4d8" font-size="15" font-weight="700" letter-spacing=".6">IN TRADERMADE COLOURS</text><text x="56" y="122.2" fill="#e6fafa" font-size="60" font-weight="700" letter-spacing="-.5">TMadeAlex</text><text x="56" y="166.0" fill="#c7dadb" font-size="23">A home on GitHub for TMade Alex, set up as a gift</text><text x="56" y="196.8" fill="#c7dadb" font-size="23">by a member of his community.</text></g>
